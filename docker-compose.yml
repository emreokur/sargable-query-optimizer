services:
  db:
    build: ./db
    environment:
      POSTGRES_DB: vet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./db/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "vet"]
      interval: 5s
      retries: 30

  app:
    build: .
    env_file: .env
    environment:
      SARGABLE_DEMO_URL: postgresql://postgres:postgres@db:5432/vet
      SARGABLE_LOCAL_HOSTS: db
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
